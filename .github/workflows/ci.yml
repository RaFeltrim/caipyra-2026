name: CI — Caipyra 2026 Práticas

on:
  push:
    branches: [main]
    paths:
      - 'Pratica/**'
  pull_request:
    paths:
      - 'Pratica/**'

jobs:
  quality:
    name: 🔍 Quality Gates (Beatriz-TL + Camila-DevOps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pratica

    steps:
      - uses: actions/checkout@v4

      # Secrets scan — obrigatório Feltrim (Camila-DevOps)
      - name: 🔐 Secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎨 Black (format check)
        run: black --check --line-length 100 .

      - name: 🔎 Flake8 (lint)
        run: flake8 . --max-line-length 100 --exclude=.venv

      - name: 🧪 Pytest (unit tests)
        run: pytest tests/ -v --tb=short

  playwright:
    name: 🎭 E2E Smoke Test (Rafael-QA)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: Pratica

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: pip install playwright

      # Cache browsers — padrão Feltrim (Camila-DevOps)
      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('Pratica/requirements.txt') }}

      - name: 🌐 Install Chromium
        run: playwright install chromium

      - name: ▶️ Run E2E (headless)
        run: python playwright-resilience/resilient_playwright.py
        env:
          HEADLESS: "true"
